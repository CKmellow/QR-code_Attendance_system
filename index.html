<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="greeting">Good Morning, Student</div>
            <div class="profile-link">
                <a href="#" id="profile">My Profile</a>
            </div>
        </nav>
        <div class="dashboard">
            
            <div class="card" id="scan">
                <img src="images/QR_code_.svg" alt="Scan QR Icon">
                <p>Scan QR Code</p>
            </div>
            <div class="card" id="attendance">
                <img src="images/myattendance.jpeg" alt="Attendance Icon">
                <p>Attendance</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
